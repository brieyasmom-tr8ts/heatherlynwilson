name = "blog-publish-cron"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Fire at 12:05 UTC daily (covers both 7:05am EST and 8:05am EDT).
# The publish script holds posts until 7am Eastern regardless,
# so in summer this fires at 8:05am ET (post already live from
# GitHub cron) and in winter it fires right at 7:05am ET.
# One trigger instead of two to stay within the free-plan limit.
[triggers]
crons = ["5 12 * * *"]
