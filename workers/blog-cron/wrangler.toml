name = "blog-publish-cron"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Cron schedule (all times UTC, ET = UTC-4 in summer):
# 10:05 UTC = 6:05am ET  → challenge daily emails + special pre/post emails
# 12:05 UTC = 8:05am ET  → blog publish + traffic digest + MWF FB blog post
# 15:05 UTC = 11:05am ET → Tue/Sat FB promo post
# 22:05 UTC = 6:05pm ET  → Thu/Sun FB promo post
[triggers]
crons = ["5 10 * * *", "5 12 * * *", "5 15 * * 2,6", "5 22 * * 0,4"]

[[d1_databases]]
binding = "DB"
database_name = "blog-engagement"
database_id = "df6d76cb-a07c-4165-a7e5-4c29e1890069"
