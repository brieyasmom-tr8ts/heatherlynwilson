<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Heather's Blog Posts | HeatherLynWilson.com</title>
<meta name="description" content="New posts every Monday, Wednesday, and Friday. Plain, honest writing on faith, Scripture, and everyday life.">
<meta property="og:title" content="Get Heather's Blog Posts">
<meta property="og:description" content="New posts every Monday, Wednesday, and Friday. Plain, honest writing on faith, Scripture, and everyday life.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --bg-soft: #f7f4ee;
  --bg-warm: #faf6ef;
  --ink: #1f2937;
  --ink-soft: #4b5563;
  --ink-quiet: #6b7280;
  --accent: #b85638;
  --accent-deep: #8d3e26;
  --gold: #c8a365;
  --border: #e5e0d5;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-warm);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 52px 48px;
  max-width: 480px;
  width: 100%;
  text-align: center;
  box-shadow: 0 4px 24px rgba(26,17,8,0.07);
}

.wordmark {
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-quiet);
  margin-bottom: 32px;
  text-decoration: none;
  display: block;
}

.wordmark span { color: var(--accent); }

h1 {
  font-family: 'Lora', serif;
  font-size: 2rem;
  font-weight: 600;
  line-height: 1.25;
  color: var(--ink);
  margin-bottom: 16px;
}

.sub {
  font-size: 1rem;
  color: var(--ink-soft);
  line-height: 1.6;
  margin-bottom: 32px;
}

.cadence {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  background: #fdf0eb;
  border: 1px solid #f5cfc3;
  border-radius: 20px;
  padding: 5px 14px;
  margin-bottom: 28px;
}

form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

input[type="email"] {
  width: 100%;
  padding: 14px 16px;
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  color: var(--ink);
  background: var(--bg-soft);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  outline: none;
  transition: border-color 0.2s;
}

input[type="email"]:focus {
  border-color: var(--accent);
}

input[type="email"]::placeholder { color: var(--ink-quiet); }

button[type="submit"] {
  width: 100%;
  padding: 14px;
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  color: #fff;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
}

button[type="submit"]:hover { background: var(--accent-deep); }
button[type="submit"]:disabled { opacity: 0.7; cursor: wait; }

.msg { font-size: 0.9rem; min-height: 20px; margin-top: 4px; }
.msg.error { color: #c0392b; }
.msg.success { color: #2d7a4f; font-weight: 500; }

.fine {
  font-size: 0.78rem;
  color: var(--ink-quiet);
  margin-top: 16px;
  line-height: 1.5;
}

.success-state {
  display: none;
}

.success-state .check {
  font-size: 2.5rem;
  margin-bottom: 16px;
}

.success-state h2 {
  font-family: 'Lora', serif;
  font-size: 1.5rem;
  margin-bottom: 12px;
  color: var(--ink);
}

.success-state p {
  color: var(--ink-soft);
  line-height: 1.6;
  margin-bottom: 24px;
}

.blog-link {
  display: inline-block;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}

.blog-link:hover { border-color: var(--accent); }

@media (max-width: 540px) {
  .card { padding: 36px 24px; }
  h1 { font-size: 1.65rem; }
}
</style>
</head>
<body>

<div class="card">
  <a href="/" class="wordmark">Heather<span>Lyn</span>Wilson.com</a>

  <div class="signup-state">
    <h1>Words worth reading.</h1>
    <p class="sub">Short reflections on Scripture and everyday faith. Honest writing, no fluff.</p>
    <div class="cadence">Monday &middot; Wednesday &middot; Friday</div>

    <form id="signupForm" onsubmit="handleSubmit(event)">
      <input type="email" id="emailInput" placeholder="Your email address" required autocomplete="email">
      <button type="submit" id="submitBtn">Subscribe</button>
      <div class="msg" id="msg"></div>
    </form>

    <p class="fine">No spam. Unsubscribe any time.</p>
  </div>

  <div class="success-state" id="successState">
    <div class="check">&#10003;</div>
    <h2>You are in.</h2>
    <p>New posts land in your inbox every Monday, Wednesday, and Friday morning.</p>
    <a href="/blog.html" class="blog-link">Read the latest posts &rarr;</a>
  </div>
</div>

<script>
function handleSubmit(e) {
  e.preventDefault();
  var email = document.getElementById('emailInput').value.trim();
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  if (!email) return;
  btn.disabled = true;
  btn.textContent = 'Subscribing...';
  msg.textContent = '';
  msg.className = 'msg';

  fetch('/api/subscribe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, source: 'subscribe-page' })
  })
  .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
  .then(function(res) {
    if (!res.ok) throw new Error((res.data && res.data.error) || 'Something went wrong.');
    if(typeof fbq!=='undefined')fbq('track','Subscribe');
    document.querySelector('.signup-state').style.display = 'none';
    document.getElementById('successState').style.display = 'block';
    localStorage.setItem('hlw_subscribed', '1');
  })
  .catch(function(err) {
    msg.textContent = (err && err.message) || 'Could not subscribe. Try again.';
    msg.className = 'msg error';
    btn.disabled = false;
    btn.textContent = 'Subscribe';
  });
}
</script>

</body>
</html>
