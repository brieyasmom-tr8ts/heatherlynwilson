<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: linear-gradient(160deg, #3d2f24 0%, #2a2018 50%, #1a1108 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  overflow: hidden;
}
.card {
  max-width: 900px;
}
.eyebrow {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #c8a365;
  margin-bottom: 24px;
}
h1 {
  font-family: 'Lora', serif;
  font-size: 64px;
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -1.5px;
  margin-bottom: 20px;
}
h1 em {
  font-style: italic;
  color: #c8a365;
  font-weight: 400;
}
.subtitle {
  font-family: 'Inter', sans-serif;
  font-size: 20px;
  font-weight: 300;
  color: rgba(250,245,236,0.65);
  margin-bottom: 32px;
  line-height: 1.5;
}
.divider {
  width: 60px;
  height: 2px;
  background: #c8a365;
  margin: 0 auto 28px;
}
.author {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #c8a365;
}
</style>
</head>
<body>
<div class="card">
<div class="eyebrow">Free Guide</div>
<h1>Reading the Bible<br>in a <em>Month</em></h1>
<div class="subtitle">How I Did It, What I Learned, and the Plan I Used</div>
<div class="divider"></div>
<div class="author">Heather Lyn Wilson</div>
</div>
</body>
</html>
