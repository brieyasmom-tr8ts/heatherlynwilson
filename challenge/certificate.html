<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Certificate of Completion | Heather Lyn Wilson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f7f4ee; font-family: 'Inter', sans-serif; color: #1f2937; }

.page-wrap { max-width: 800px; margin: 40px auto; padding: 0 24px; }
.page-title { font-family: 'Lora', serif; font-size: 24px; text-align: center; margin-bottom: 8px; }
.page-sub { text-align: center; color: #6b7280; font-size: 14px; margin-bottom: 32px; }

/* Certificate */
.cert-frame {
  background: white;
  border: 3px solid #c8a365;
  border-radius: 4px;
  padding: 12px;
  box-shadow: 0 8px 40px -12px rgba(0,0,0,0.15);
}
.cert-inner {
  border: 1px solid #e5e0d5;
  padding: 60px 48px;
  text-align: center;
  position: relative;
  min-height: 520px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* Corner decorations */
.cert-inner::before, .cert-inner::after {
  content: '';
  position: absolute;
  width: 60px;
  height: 60px;
  border-color: #c8a365;
  border-style: solid;
}
.cert-inner::before { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
.cert-inner::after { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

.cert-eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #c8a365;
  margin-bottom: 16px;
}
.cert-title {
  font-family: 'Lora', serif;
  font-size: 36px;
  font-weight: 600;
  color: #1f2937;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}
.cert-subtitle {
  font-size: 15px;
  color: #6b7280;
  font-weight: 300;
  margin-bottom: 32px;
}
.cert-name {
  font-family: 'Great Vibes', cursive;
  font-size: 52px;
  color: #b85638;
  margin-bottom: 24px;
  line-height: 1.2;
}
.cert-body {
  font-size: 15px;
  color: #4b5563;
  line-height: 1.7;
  max-width: 440px;
  margin: 0 auto 16px;
  font-weight: 300;
}
.cert-track {
  font-family: 'Lora', serif;
  font-size: 18px;
  font-weight: 600;
  color: #1f2937;
  margin: 12px 0 8px;
}
.cert-date {
  font-size: 13px;
  color: #6b7280;
  margin-bottom: 32px;
}
.cert-divider {
  width: 80px;
  height: 1px;
  background: #c8a365;
  margin: 0 auto 24px;
}
.cert-verse {
  font-family: 'Lora', serif;
  font-style: italic;
  font-size: 16px;
  color: #4b5563;
  line-height: 1.6;
  max-width: 380px;
  margin: 0 auto 8px;
}
.cert-verse-ref {
  font-size: 12px;
  color: #c8a365;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.cert-site {
  margin-top: 24px;
  font-size: 12px;
  color: #c8a365;
  letter-spacing: 1px;
}

/* Not earned state */
.cert-locked {
  text-align: center;
  padding: 80px 24px;
}
.cert-locked h2 {
  font-family: 'Lora', serif;
  font-size: 28px;
  margin-bottom: 12px;
}
.cert-locked p {
  font-size: 16px;
  color: #6b7280;
  font-weight: 300;
  line-height: 1.6;
  max-width: 400px;
  margin: 0 auto 24px;
}
.cert-locked .progress-info {
  font-size: 48px;
  font-family: 'Lora', serif;
  font-weight: 700;
  color: #b85638;
  margin-bottom: 4px;
}
.cert-locked .progress-label {
  font-size: 14px;
  color: #6b7280;
  margin-bottom: 24px;
}
.cert-locked a {
  color: #b85638;
  text-decoration: underline;
}

/* Actions */
.cert-actions {
  text-align: center;
  margin-top: 32px;
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}
.cert-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 28px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: opacity 0.2s;
  text-decoration: none;
  color: white;
}
.cert-btn:hover { opacity: 0.85; }
.cert-btn.primary { background: #b85638; }
.cert-btn.fb { background: #1877f2; }
.cert-btn.dark { background: #1f2937; }

.loading { text-align: center; padding: 80px; color: #6b7280; }

@media (max-width: 600px) {
  .cert-inner { padding: 40px 24px; }
  .cert-name { font-size: 36px; }
  .cert-title { font-size: 28px; }
}

@media print {
  body { background: white; }
  .page-wrap { margin: 0; padding: 0; max-width: none; }
  .page-title, .page-sub, .cert-actions { display: none; }
  .cert-frame { box-shadow: none; border-width: 2px; }
}
</style>
</head>
<body>

<div class="page-wrap">

<div class="loading" id="loading">Loading your certificate...</div>

<div id="certContent" style="display:none;">
<h1 class="page-title" id="pageTitle"></h1>
<p class="page-sub" id="pageSub"></p>

<div class="cert-frame" id="certFrame">
<div class="cert-inner" id="certInner">
<!-- Filled by JS -->
</div>
</div>

<div class="cert-actions" id="certActions">
<!-- Filled by JS -->
</div>
</div>

<div id="certLocked" style="display:none;">
<div class="cert-locked">
<h2>Your certificate is waiting</h2>
<div class="progress-info" id="lockedProgress">0</div>
<div class="progress-label">of 31 days completed</div>
<p>Complete all 31 days of reading and your certificate will be here. Keep going. You are closer than you think.</p>
<p><a href="dashboard.html" id="dashLink">Back to dashboard</a></p>
</div>
</div>

</div>

<script>
var params = new URLSearchParams(window.location.search);
var email = (params.get('email') || '').trim().toLowerCase();
var token = params.get('token') || '';
var preview = params.get('preview') === '1';
var challenge = params.get('challenge') || 'july-2026';
var isBeatitudes = challenge === 'september-beatitudes-2026';
var isProverbs = challenge === 'october-proverbs-2026';
var isThanks = challenge === 'november-thanks-2026';
var isGospels = challenge === 'december-gospels-2026';
var isJames = challenge === 'august-james-2026';
var totalNeeded = (isBeatitudes || isThanks) ? 30 : 31; // becomes 90 for the 3-month tracks once the track is known
var defaultStart = isBeatitudes ? '2026-09-01' : (isProverbs ? '2026-10-01' : (isThanks ? '2026-11-01' : (isGospels ? '2026-12-01' : (isJames ? '2026-08-01' : '2026-07-01'))));

if (preview) {
  // Admin preview mode
  var previewName = params.get('name') || 'Sarah Johnson';
  var previewTrack = params.get('track') || (isBeatitudes ? 'niv' : 'full-bible');
  if ((previewTrack || '').slice(-3) === '-90') totalNeeded = 90;
  var previewStart = params.get('start') || defaultStart;
  document.getElementById('loading').style.display = 'none';
  showCertificate(previewName, previewTrack, previewStart);
} else if (!email || !token) {
  document.getElementById('loading').textContent = 'No login found. Please access this from your dashboard.';
} else {
  // Progress comes from the check-in API for July, the journal API for the
  // Beatitudes memory challenge and the family Proverbs challenge.
  var progressUrl = (isBeatitudes || isProverbs || isThanks || isGospels || isJames)
    ? '/api/challenge-journal?email=' + encodeURIComponent(email) + '&token=' + encodeURIComponent(token) + '&challenge=' + challenge
    : '/api/challenge-checkin?email=' + encodeURIComponent(email) + '&token=' + encodeURIComponent(token);
  Promise.all([
    fetch('/api/challenge-login?email=' + encodeURIComponent(email) + '&token=' + encodeURIComponent(token)).then(function(r) { return r.json(); }),
    fetch(progressUrl).then(function(r) { return r.json(); })
  ]).then(function(results) {
    var userData = results[0];
    var progressData = results[1];

    if (!userData.success) {
      document.getElementById('loading').textContent = 'Invalid link. Please log in again.';
      return;
    }

    var name = userData.user.name || 'Friend';
    var mine = null;
    var chs = userData.user.challenges || [];
    for (var i = 0; i < chs.length; i++) {
      if (chs[i].challenge === challenge) mine = chs[i];
    }
    var track = mine ? (mine.track || (isBeatitudes ? 'niv' : 'full-bible')) : (userData.user.track || (isBeatitudes ? 'niv' : 'full-bible'));
    if ((track || '').slice(-3) === '-90') totalNeeded = 90;
    var startIso = mine ? (mine.personal_start_date || defaultStart) : defaultStart;
    var total = progressData.total || 0;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('dashLink').href = 'dashboard.html?email=' + encodeURIComponent(email) + '&token=' + encodeURIComponent(token);

    if (total < totalNeeded) {
      document.getElementById('lockedProgress').textContent = total;
      var lp = document.querySelector('#certLocked .progress-label');
      if (lp) lp.textContent = 'of ' + totalNeeded + ' days completed';
      document.getElementById('certLocked').style.display = 'block';
      return;
    }

    showCertificate(name, track, startIso);

  }).catch(function() {
    document.getElementById('loading').textContent = 'Could not load your data. Please try again.';
  });
}

function formatCertDate(d) {
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

function showCertificate(name, track, startIso) {
  // Each person has their own window based on their start date. Sanitize to
  // YYYY-MM-DD so a stray value can never produce an Invalid Date / NaN.
  var cleanStart = /^\d{4}-\d{2}-\d{2}/.test(String(startIso || '')) ? String(startIso).slice(0, 10) : defaultStart;
  var start = new Date(cleanStart + 'T00:00:00');
  if (isNaN(start.getTime())) start = new Date(defaultStart + 'T00:00:00');
  var end = new Date(start);
  end.setDate(end.getDate() + (totalNeeded - 1));
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dateRange = (start.getFullYear() === end.getFullYear())
    ? months[start.getMonth()] + ' ' + start.getDate() + ' to ' + formatCertDate(end)
    : formatCertDate(start) + ' to ' + formatCertDate(end);

  document.getElementById('pageTitle').textContent = 'You did it, ' + name + '.';
  document.getElementById('pageSub').textContent = 'Screenshot it. Print it. Share it. You earned this.';
  document.getElementById('certContent').style.display = 'block';

  var cfg;
  if (isBeatitudes) {
    cfg = {
      title: 'Hide It In Your Heart',
      body1: 'has memorized the Beatitudes, Matthew 5:1-12, and hidden the very heart of Jesus in their heart.',
      body2: 'Thirty days of showing up. Words that are now carried everywhere, ready for every hard day and every good one.',
      track: '30 Days. Eight Blessings. One Heart Changed.',
      verse: '&ldquo;I have hidden your word in my heart, that I might not sin against you.&rdquo;',
      verseRef: 'Psalm 119:11',
      shareText: 'I just memorized the Beatitudes in the Hide It In Your Heart challenge with Heather Wilson. 30 days. Hidden in my heart for good.',
      shareUrl: 'https://heatherlynwilson.com/challenge-beatitudes',
      igText: 'I just memorized the Beatitudes with @heatherlynwilson.\n\n30 days. Hidden in my heart for good.\n\n#HideItInYourHeart\n\nheatherlynwilson.com/challenge-beatitudes'
    };
  } else if (isThanks) {
    cfg = {
      title: 'Give Thanks',
      body1: track === 'all-psalms'
        ? 'has completed the Give Thanks challenge and read the entire book of Psalms, all 150, in thirty days.'
        : 'has completed the Give Thanks challenge: thirty days in the Psalms with a heart turned toward gratitude.',
      body2: 'Ninety thanks written down, one month of praise, and a life that counts its blessings by name.',
      track: '30 Days. 90 Thanks. One Grateful Heart.',
      verse: '&ldquo;Give thanks to the Lord, for he is good; his love endures forever.&rdquo;',
      verseRef: 'Psalm 107:1',
      shareText: 'I just finished the Give Thanks challenge with Heather Wilson. Thirty days in the Psalms and ninety written thanks.',
      shareUrl: 'https://heatherlynwilson.com/challenge-thanks',
      igText: 'I just finished the Give Thanks challenge with @heatherlynwilson.\n\n30 days in the Psalms. 90 written thanks.\n\n#GiveThanksChallenge\n\nheatherlynwilson.com/challenge-thanks'
    };
  } else if (isGospels) {
    cfg = {
      title: 'God With Us',
      body1: track === 'luke'
        ? 'has completed the God With Us challenge and read the Gospel of Luke, finishing the whole story of Jesus by Christmas Eve.'
        : 'has completed the God With Us challenge and read all four Gospels, the entire life of Jesus told by four witnesses, in one month.',
      body2: 'Mark showed what He did. John told who He is. Matthew proved He is the promised King. And Luke opened the manger on Christmas Eve.',
      track: 'One Month. Four Witnesses. One Jesus.',
      verse: '&ldquo;The Word became flesh and made his dwelling among us.&rdquo;',
      verseRef: 'John 1:14',
      shareText: 'I just read the Gospels this December in the God With Us challenge with Heather Wilson. The manger reads differently now.',
      shareUrl: 'https://heatherlynwilson.com/challenge-gospels',
      igText: 'I just read the Gospels this December with @heatherlynwilson.\n\nThe manger reads differently now.\n\n#GodWithUs\n\nheatherlynwilson.com/challenge-gospels'
    };
  } else if (isProverbs) {
    cfg = {
      title: 'Around the Table',
      body1: 'has completed Around the Table and read all 31 chapters of Proverbs as a family.',
      body2: 'A month of big ideas, honest questions, and wisdom passed around the table and down the road. This family showed up together.',
      track: '31 Days. 31 Chapters. One Family Growing in Wisdom.',
      verse: '&ldquo;By wisdom a house is built, and through understanding it is established.&rdquo;',
      verseRef: 'Proverbs 24:3',
      shareText: 'Our family just read all 31 chapters of Proverbs together in the Around the Table challenge with Heather Wilson. Table, car, wherever. We did it.',
      shareUrl: 'https://heatherlynwilson.com/challenge-proverbs',
      igText: 'Our family just read all 31 chapters of Proverbs together with @heatherlynwilson.\n\nTable, car, wherever. We did it.\n\n#AroundTheTable\n\nheatherlynwilson.com/challenge-proverbs'
    };
  } else if (isJames) {
    cfg = {
      title: 'One Book Deep',
      body1: 'has completed One Book Deep and read the book of James every day for thirty-one days.',
      body2: 'One book, read over and over, until it stopped being words on a page and started being the way a life is lived. Faith that shows up in what a person actually does.',
      track: '31 Days. One Book. Faith That Works.',
      verse: '&ldquo;Do not merely listen to the word, and so deceive yourselves. Do what it says.&rdquo;',
      verseRef: 'James 1:22',
      shareText: 'I just read the book of James every day for 31 days in the One Book Deep challenge with Heather Wilson. One book, all the way down.',
      shareUrl: 'https://heatherlynwilson.com/challenge-james',
      igText: 'I just read James every day for 31 days with @heatherlynwilson.\n\nOne book, all the way down.\n\n#OneBookDeep\n\nheatherlynwilson.com/challenge-james'
    };
  } else {
    var nt = track === 'new-testament';
    var chrono = track === 'chronological';
    var ninety = (track || '').slice(-3) === '-90';
    cfg = {
      title: ninety ? 'The Bible in 3 Months' : '31-Day Bible Challenge',
      body1: nt ? 'has completed the 31-Day Bible Challenge and journeyed through the entire New Testament.'
                : track === 'chrono-90' ? 'has read the entire Bible in three months, in the order it happened.'
                : track === 'bible-90' ? 'has read the entire Bible in three months, from cover to cover.'
                : track === 'ot-90' ? 'has read the entire Old Testament in three months, from Genesis to Malachi.'
                : track === 'nt-90' ? 'has read the entire New Testament in three months, from Matthew to Revelation.'
                : chrono ? 'has completed the 31-Day Bible Challenge and journeyed through the entire story of Scripture, in the order it happened.'
                : 'has completed the 31-Day Bible Challenge and journeyed through the entire story of Scripture.',
      body2: (nt ? 'From Matthew to Revelation' : chrono ? 'From creation to the new creation' : 'From Genesis to Revelation') + ', every page points to God’s faithfulness, His redemption, and His invitation to know Him more.',
      track: ninety ? '90 Days. One Story. A Lifetime of Discovery.' : '31 Days. One Story. A Lifetime of Discovery.',
      verse: '&ldquo;Thy word is a lamp unto my feet, and a light unto my path.&rdquo;',
      verseRef: 'Psalm 119:105',
      shareText: ninety ? 'I just read the whole Bible in 3 months with Heather Wilson. 90 days. No guilt. Just showing up.' : 'I just finished reading ' + (nt ? 'the New Testament' : 'the entire Bible') + ' in the 31-Day Bible Challenge with Heather Wilson. 31 days. No guilt. Just showing up.',
      shareUrl: 'https://heatherlynwilson.com/challenge',
      igText: ninety ? 'I just read the whole Bible in 3 months with @heatherlynwilson.\n\n90 days. No guilt. Just showing up.\n\nheatherlynwilson.com/challenge' : 'I just finished reading ' + (nt ? 'the New Testament' : 'the entire Bible') + ' in the 31-Day Bible Challenge with @heatherlynwilson.\n\n31 days. No guilt. Just showing up.\n\nheatherlynwilson.com/challenge'
    };
  }

  document.getElementById('certInner').innerHTML =
    '<div class="cert-eyebrow">Certificate of Completion</div>' +
    '<div class="cert-title">' + cfg.title + '</div>' +
    '<div class="cert-subtitle">This certifies that</div>' +
    '<div class="cert-name">' + escapeHtml(name) + '</div>' +
    '<div class="cert-body">' + cfg.body1 + '</div>' +
    '<div class="cert-body">' + cfg.body2 + '</div>' +
    '<div class="cert-track">' + cfg.track + '</div>' +
    '<div class="cert-date">' + dateRange + '</div>' +
    '<div class="cert-divider"></div>' +
    '<div class="cert-verse">' + cfg.verse + '</div>' +
    '<div class="cert-verse-ref">' + cfg.verseRef + '</div>' +
    '<div class="cert-site">HeatherLynWilson.com</div>';

  document.getElementById('certActions').innerHTML =
    '<button class="cert-btn primary" onclick="window.print()">Print / Save as PDF</button>' +
    '<button class="cert-btn fb" onclick="shareCert()">Share</button>' +
    '<button class="cert-btn dark" onclick="copyShare()">Copy for Instagram</button>';

  window.shareCert = function() {
    if (navigator.share) {
      navigator.share({ text: cfg.shareText, url: cfg.shareUrl }).catch(function() {});
    } else {
      window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(cfg.shareUrl) + '&quote=' + encodeURIComponent(cfg.shareText), '_blank', 'width=600,height=480');
    }
  };

  window.copyShare = function() {
    navigator.clipboard.writeText(cfg.igText).then(function() {
      alert('Copied to clipboard! Paste it into your Instagram caption.');
    });
  };
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
