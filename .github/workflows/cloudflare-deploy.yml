name: Manual Cloudflare Pages deploy

# Manually triggered fallback when Cloudflare's Git auto-detection is broken.
# Requires CLOUDFLARE_API_TOKEN as a repository secret.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 pages deploy . \
            --project-name=heatherlynwilson \
            --branch=main \
            --commit-dirty=true

      - name: Push Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          echo "$BREVO_API_KEY" | npx --yes wrangler@4 pages secret put BREVO_API_KEY --project-name=heatherlynwilson
          echo "$NOTIFY_SECRET" | npx --yes wrangler@4 pages secret put NOTIFY_SECRET --project-name=heatherlynwilson
