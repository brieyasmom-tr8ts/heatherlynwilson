name: Publish scheduled blog posts

# Publishes scheduled blog posts as static HTML and deploys to Cloudflare Pages.
# The subscriber notification email is sent by the blog-cron Cloudflare Worker
# at 8:05am ET (no GitHub token needed). This workflow just generates the HTML
# and updates blog.html. A Pages Function fallback serves the post from the
# content-queue JSON until this workflow runs, so the email link always works.
#
# GitHub Actions crons are unreliable (often 1-3 hours late), so we schedule
# four runs on Mon/Wed/Fri. The script is idempotent — extra runs are no-ops.
on:
  schedule:
    - cron: "45 10 * * 1,3,5"   # 6:45am EDT Mon/Wed/Fri; GH lateness usually lands this 7-9am
    - cron: "15 11 * * 1,3,5"   # 7:15am EDT fallback
    - cron: "30 12 * * 1,3,5"   # 8:30am EDT fallback
    - cron: "0 13 * * 1,3,5"    # 9:00am EDT fallback
    - cron: "30 13 * * 1,3,5"   # 8:30am EST (winter) / 9:30am EDT fallback
    - cron: "0 14 * * 1,3,5"    # 10:00am EDT last-resort fallback
  workflow_dispatch: {}          # manual trigger or worker dispatch

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Facebook posts go out at 8:05am ET (before this workflow), so each
      # queued post's branded image must exist ahead of its publish day.
      # This generates any that are missing and pushes them right away.
      - name: Generate Facebook images for queued posts
        run: |
          pip install --quiet pillow
          python3 scripts/generate_fb_blog_images.py
          if ! git diff --quiet || [ -n "$(git status --porcelain images/blog-fb)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add images/blog-fb
            git commit -m "Generate Facebook images for queued blog posts" || true
            git push || true
          fi

      - name: Publish any posts that are due
        id: publish
        env:
          # A manual run from the Actions tab publishes immediately, ignoring
          # the 8:30am hold, so you can test without waiting for morning.
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/publish_queue.py

      - name: Commit and push if anything was published
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish scheduled blog post(s)"
          git push

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.publish.outputs.published == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Pull the bot's commit we just pushed so the deploy includes the new post
          git pull origin main
          npx --yes wrangler@4 pages deploy . \
            --project-name=heatherlynwilson \
            --branch=main \
            --commit-dirty=true

      # Subscriber notification emails are now sent directly by the
      # blog-cron Cloudflare Worker at 8:05am ET. No action needed here.
