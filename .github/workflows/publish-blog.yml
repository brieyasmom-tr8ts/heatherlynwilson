name: Publish scheduled blog posts

# Posts go live at 8:30am Eastern on their scheduled date. GitHub Actions crons
# are unreliable (often 1-3 hours late), so we schedule FOUR runs on Mon/Wed/Fri
# from 12:30-14:00 UTC. The script holds posts until 8:30am ET and is idempotent,
# so extra runs are harmless no-ops. The blog-cron Cloudflare Worker also
# dispatches this workflow at 8:05am ET as the primary reliable trigger.
on:
  schedule:
    - cron: "30 12 * * 1,3,5"   # 8:30am EDT Mon/Wed/Fri (summer)
    - cron: "0 13 * * 1,3,5"    # 9:00am EDT fallback
    - cron: "30 13 * * 1,3,5"   # 8:30am EST Mon/Wed/Fri (winter) / 9:30am EDT fallback
    - cron: "0 14 * * 1,3,5"    # 10:00am EDT last-resort fallback
  workflow_dispatch: {}          # manual trigger or worker dispatch

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish any posts that are due
        id: publish
        env:
          # A manual run from the Actions tab publishes immediately, ignoring
          # the 8:30am hold, so you can test without waiting for morning.
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/publish_queue.py

      - name: Commit and push if anything was published
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish scheduled blog post(s)"
          git push

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.publish.outputs.published == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Pull the bot's commit we just pushed so the deploy includes the new post
          git pull origin main
          npx --yes wrangler@4 pages deploy . \
            --project-name=heatherlynwilson \
            --branch=main \
            --commit-dirty=true

      # Only notify subscribers if the deploy actually succeeded. If deploy
      # fails, the post is in git but not on the live site, so the email
      # link would 404. Skipping the email avoids that.
      - name: Notify subscribers
        if: success() && steps.publish.outputs.published == 'true' && steps.deploy.outcome == 'success'
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          POST_TITLE: ${{ steps.publish.outputs.post_title }}
          POST_EXCERPT: ${{ steps.publish.outputs.post_excerpt }}
          POST_SLUG: ${{ steps.publish.outputs.post_slug }}
        run: |
          curl -s -X POST "https://heatherlynwilson.com/api/notify-subscribers" \
            -H "Content-Type: application/json" \
            -H "X-Notify-Secret: $NOTIFY_SECRET" \
            -d "{\"title\": \"$POST_TITLE\", \"excerpt\": \"$POST_EXCERPT\", \"url\": \"https://heatherlynwilson.com/blog/$POST_SLUG.html\"}"
