name: Publish scheduled blog posts

# Posts go live at 7am Eastern on their scheduled date. GitHub runs cron in
# UTC with no daylight-saving awareness, so we fire at both 11:00 UTC (7am EDT
# in summer) and 12:00 UTC (7am EST in winter). The script holds posts until it
# is actually 7am Eastern, so whichever run hits 7am does the publishing and the
# other is a harmless no-op. The Mon/Wed/Fri rhythm comes from the dates
# assigned to each queued post, and running daily lets a delayed run still
# catch the right post.
on:
  schedule:
    - cron: "0 11 * * *"   # 7am EDT (summer)
    - cron: "0 12 * * *"   # 7am EST (winter)
  workflow_dispatch: {}      # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish any posts that are due
        id: publish
        env:
          # A manual run from the Actions tab publishes immediately, ignoring
          # the 7am hold, so you can test without waiting for morning.
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/publish_queue.py

      - name: Commit and push if anything was published
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish scheduled blog post(s)"
          git push
